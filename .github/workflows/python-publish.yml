name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Convert README images to absolute paths
        run: |
          sed -i 's|src="images/|src="https://raw.githubusercontent.com/${{ github.repository }}/main/images/|g' README.md
          sed -i 's|(\(images/.*\))|(https://raw.githubusercontent.com/${{ github.repository }}/main/\1)|g' README.md

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
